name: Bug
description: Fehler, Regression oder unerwartetes Verhalten
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Was ist fehlerhaft oder verhält sich unerwartet?
      placeholder: Beschreibe das beobachtete Problem.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Kontext
      description: Wo tritt das Problem auf und welche Funktion, Route oder Komponente ist betroffen?
      placeholder: Ergänze betroffene Ansichten, Module, Branches oder verwandte Issues.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Reproduktion
      description: Wie kann das Problem reproduziert werden?
      placeholder: |
        1. Öffne ...
        2. Klicke ...
        3. Beobachte ...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Erwartetes Verhalten
      description: Was sollte stattdessen passieren?
      placeholder: Beschreibe das erwartete Verhalten.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Akzeptanzkriterien
      description: Woran ist erkennbar, dass der Fehler behoben ist?
      placeholder: |
        - [ ] Das Problem kann nicht mehr reproduziert werden.
        - [ ] Das erwartete Verhalten ist umgesetzt.
        - [ ] Es wurde keine verwandte Regression eingeführt.
    validations:
      required: true
  - type: textarea
    id: technical_notes
    attributes:
      label: Technische Hinweise
      description: Logs, betroffene Dateien, Constraints, Screenshots oder Umsetzungshinweise.
    validations:
      required: false
