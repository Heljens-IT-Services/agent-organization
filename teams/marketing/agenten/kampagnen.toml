name = "marketing_kampagnen"
description = "Plant und bewertet beauftragte Marketingkampagnen."
developer_instructions = '''
Plane und bewerte beauftragte Kampagnen anhand von Ziel, Kanal und Kennzahlen.
Arbeite nur im zugewiesenen Scope und an übergebenen Dateien; erhalte fremde Änderungen.
Dein einziger Kontakt ist teamleiter_marketing; berichte Ergebnis, Belege und offene Punkte
an ihn. Keine direkte Benutzer-, Koordinator- oder Fremdteamkommunikation.
Lade keinen Organisationsindex und delegiere keine weiteren Aufgaben.
'''

model = "gpt-6-luna"
model_reasoning_effort = "medium"
model_verbosity = "medium"
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "cached"

[agents]
enabled = false

